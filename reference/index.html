<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1B2021" />
  <title>Sapir Developer Hub · Motion Preview</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./brand.css" />
</head>
<body>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 21v-8h6v8"/></symbol>
    <symbol id="i-checksquare" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></symbol>
    <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8A8.5 8.5 0 0 1 12.5 20a8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 12.5 3h.5a8.5 8.5 0 0 1 8 8v.5Z"/></symbol>
    <symbol id="i-bot" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="3"/><path d="M12 3v5M9 3h6M8 14h.01M16 14h.01M9 18h6M1 13v4M23 13v4"/></symbol>
    <symbol id="i-wand" viewBox="0 0 24 24"><path d="m15 4 5 5M4 20 19 5M11 2v3M2 11h3M19 16v3M16 19h3M4 3l2 2"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.9 2- .1-.1a1.7 1.7 0 0 0-1.9-.3l-.2.1a1.7 1.7 0 0 0-1 1.5V21h-2.9v-.8a1.7 1.7 0 0 0-1-1.5l-.2-.1a1.7 1.7 0 0 0-1.9.3l-.1.1-2-2 .1-.1a1.7 1.7 0 0 0 .3-1.9l-.1-.2a1.7 1.7 0 0 0-1.5-1H4v-2.8h.8a1.7 1.7 0 0 0 1.5-1l.1-.2a1.7 1.7 0 0 0-.3-1.9L6 7.8l2-2 .1.1a1.7 1.7 0 0 0 1.9.3l.2-.1a1.7 1.7 0 0 0 1-1.5V4h2.8v.8a1.7 1.7 0 0 0 1 1.5l.2.1a1.7 1.7 0 0 0 1.9-.3l.1-.1 2 2-.1.1a1.7 1.7 0 0 0-.3 1.9l.1.2a1.7 1.7 0 0 0 1.5 1h.8V14h-.8a1.7 1.7 0 0 0-1.5 1Z" transform="translate(-.5 -.5) scale(.98)"/></symbol>
    <symbol id="i-bug" viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="13" rx="6"/><path d="M9 8V5a3 3 0 0 1 6 0v3M3 12h4m10 0h4M3 17h4m10 0h4M12 8v13"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7.3"/><path d="m16.2 16.2 5 5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M13 5h6v6M10 14 19 5"/><path d="M19 13v6H5V5h6"/></symbol>
    <symbol id="i-git" viewBox="0 0 24 24"><path d="m12 2 10 10-10 10L2 12 12 2Z"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="15" r="1"/><circle cx="15" cy="9" r="1"/><path d="M9 10v4l5 1M10 9h4"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.7 9a7 7 0 0 1 11.7-2L20 12M4 12l2.6 5A7 7 0 0 0 18.3 15"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="i-command" viewBox="0 0 24 24"><path d="M9 7V5a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v14a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V7Z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h7"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="m10 13 4-4M8 16H6a4 4 0 0 1 0-8h4m4 0h4a4 4 0 0 1 0 8h-4"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 2.6 7.4L22 12l-7.4 2.6L12 22l-2.6-7.4L2 12l7.4-2.6L12 2Z"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 7h16M7 12h10m-7 5h4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M4 18v3h16v-3"/></symbol>
    <symbol id="i-graph" viewBox="0 0 24 24"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="m7 7 4 9M17 7l-4 9M7 6h10"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 11v6M12 7h.01"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3Z"/></symbol>
    <symbol id="i-checkcircle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m7 12 3 3 7-7"/></symbol>
  </svg>

  <div class="app-shell">
    <header class="masthead">
      <button class="brand" id="brand-home" type="button" aria-label="На главную">
        <img src="./assets/sapir-mark-white.png" alt="" />
        <span><strong>Developer Hub</strong><small>SAPIR GAME / WORKSPACE</small></span>
      </button>
      <div class="bread"><span>Workspace</span><svg class="ic" aria-hidden="true"><use href="#i-chevron"/></svg><span id="current-location">Обзор</span></div>
      <div class="top-actions">
        <button class="search-trigger" id="open-search" aria-label="Поиск по всему Hub"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><span>Быстрый поиск</span><kbd>Ctrl K</kbd></button>
        <button class="icon-button" id="report-bug" aria-label="Нашли проблему или баг?" title="Нашли проблему или баг?"><svg class="ic" aria-hidden="true"><use href="#i-bug"/></svg></button>
        <button class="icon-button" id="replay-welcome" aria-label="Показать приветствие" title="Показать приветствие"><svg class="ic" aria-hidden="true"><use href="#i-spark"/></svg></button>
      </div>
    </header>
    <main id="page" class="page"></main>
    <nav class="dock" aria-label="Разделы Developer Hub">
      <span class="dock-marker" aria-hidden="true"></span>
      <button class="nav-item" type="button" data-route="home" aria-label="Обзор" title="Обзор"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg><span>Обзор</span></button>
      <button class="nav-item" type="button" data-route="tasks" aria-label="Мои задачи" title="Мои задачи"><svg class="ic" aria-hidden="true"><use href="#i-checksquare"/></svg><span>Задачи</span></button>
      <button class="nav-item" type="button" data-route="knowledge" aria-label="База знаний" title="База знаний"><svg class="ic" aria-hidden="true"><use href="#i-book"/></svg><span>Знания</span></button>
      <button class="nav-item" type="button" data-route="news" aria-label="Новости отдела" title="Новости отдела"><svg class="ic" aria-hidden="true"><use href="#i-message"/></svg><span>Новости</span></button>
      <button class="nav-item" type="button" data-route="agents" aria-label="AI Agents" title="AI Agents"><svg class="ic" aria-hidden="true"><use href="#i-bot"/></svg><span>AI Agents</span></button>
      <button class="nav-item" type="button" data-route="prompts" aria-label="Prompt Builder" title="Prompt Builder"><svg class="ic" aria-hidden="true"><use href="#i-wand"/></svg><span>Промпты</span></button>
      <button class="nav-item" type="button" data-route="settings" aria-label="Настройки" title="Настройки"><svg class="ic" aria-hidden="true"><use href="#i-settings"/></svg><span>Настройки</span></button>

      <button class="dock-grip" type="button" aria-label="Переместить панель" title="Удерживайте и тяните. С клавиатуры используйте стрелки."><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 5h.01M15 5h.01M9 12h.01M15 12h.01M9 19h.01M15 19h.01" stroke-width="2.8"/></svg></button>
    </nav>
  </div>
  <div class="dock-flow" aria-hidden="true"></div>
  <div id="overlay-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog class="welcome" id="welcome" aria-labelledby="welcome-title">
    <div class="welcome-scene" aria-hidden="true"><canvas class="prism-canvas" data-prism="intro"></canvas></div>
    <div class="welcome-frame" aria-hidden="true"></div>
    <span class="welcome-index" aria-hidden="true">01 / SAPIR GAME</span>
    <div class="welcome-content">
      <img class="welcome-logo" src="./assets/sapir-logo-welcome.png" alt="Sapir Game" width="3504" height="1869" />
      <div class="hero-label">Developer Hub</div>
      <h1 class="welcome-title" id="welcome-title">Добро пожаловать</h1>
      <p class="welcome-copy">Ваши задачи, знания и инструменты разработки в одном пространстве.</p>
      <div class="welcome-actions">
        <button class="btn btn-primary" id="welcome-enter">Открыть рабочее пространство <svg class="ic" aria-hidden="true"><use href="#i-arrow"/></svg></button>
        <small class="welcome-hint">Демонстрационный режим · Esc, чтобы пропустить</small>
      </div>
    </div>
  </dialog>
  <script src="./motion.js" defer></script>
  <script src="./prism.js" defer></script>
  <script src="./dock.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
